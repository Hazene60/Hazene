<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hazene — Launch videos for AI & SaaS startups</title>
<meta name="description" content="From idea to launch-ready video. Motion design launch videos for AI & SaaS startups.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<meta property="og:title" content="Hazene — Launch videos for AI & SaaS startups">
<meta property="og:description" content="From idea to launch-ready video.">
<meta property="og:url" content="https://hazene60.github.io/Hazene/">
<meta property="og:image" content="https://hazene60.github.io/Hazene/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .hero{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 24px 110px}
  .hero .btns{margin-top:22px}
  .clients{margin-top:72px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .clients-label{font-size:12px;font-weight:500;color:var(--muted)}
  .logos{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:20px 40px;max-width:720px}
  .logos img{height:26px;width:auto;object-fit:contain;filter:grayscale(1);opacity:.6;transition:filter .3s ease,opacity .3s ease}
  .logos img.rise{height:34px;filter:grayscale(1) brightness(0);opacity:.45}
  .logos img:hover{filter:none;opacity:1}
  /* Logo texte provisoire, en attendant le vrai fichier */
  .logos .wm{font-size:20px;font-weight:600;letter-spacing:-.03em;color:#000;opacity:.45}
  @media (max-width:767px){
    .hero{padding:110px 16px 90px}
    .clients{margin-top:56px}
    .logos{gap:16px 28px}
    .logos img{height:22px}
    .logos img.rise{height:28px}
    .logos .wm{font-size:17px}
  }
</style>
</head>
<body>
<div class="frame-guide l" aria-hidden="true"></div>
<div class="frame-guide r" aria-hidden="true"></div>

<header class="top appear">
  <span class="mono">motion design</span>
  <span class="wordmark">HAZENE</span>
  <span class="mono" data-clock>--:--</span>
</header>

<main class="hero">
  <h1 class="appear" style="animation-delay:.1s">Launch videos for<br><span class="accent">AI &amp; SaaS</span> startups</h1>
  <p class="sub appear" style="animation-delay:.2s"><b>From idea</b> to launch-ready video.</p>
  <div class="btns appear" style="animation-delay:.3s">
    <a class="btn soft" href="portfolio.html"><span class="roll"><span>See portfolio</span><span aria-hidden="true">See portfolio</span></span></a>
    <a class="btn dark" href="call.html"><span class="roll"><span>Book a call</span><span aria-hidden="true">Book a call</span></span></a>
  </div>

  <section class="clients appear" style="animation-delay:.45s" aria-label="Clients">
    <span class="clients-label">Trusted by</span>
    <div class="logos">
      <img src="logos/runinfra.svg" alt="RunInfra">
      <img src="logos/rightnow.png" alt="RightNow">
      <img class="rise" src="logos/rise.png" alt="Rise">
      <img src="logos/synaps.png" alt="Synaps">
    </div>
  </section>
</main>

<footer class="foot appear" style="animation-delay:.5s">
  <a class="mono" href="https://www.linkedin.com/in/yoann-hazene-72b917331/" target="_blank" rel="noopener">LinkedIn</a>
  <a class="mono" href="https://x.com/Hazene_Edit" target="_blank" rel="noopener">@Hazene_Edit</a>
</footer>

<script src="clock.js"></script>
</body>
</html>
