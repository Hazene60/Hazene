<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio — Hazene</title>
<meta name="description" content="Launch videos for AI & SaaS startups by Hazene.">
<link rel="icon" href="favicon.png" type="image/png">
<meta property="og:title" content="Portfolio — Hazene">
<meta property="og:image" content="https://hazene60.github.io/Hazene/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap{position:relative;z-index:10;width:100%;max-width:1040px;margin:0 auto;padding:230px 20px 0}
  .head{text-align:center}
  .head h1{font-size:50px}
  .grid{margin-top:64px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .card{display:block;color:inherit}
  .media{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:4px;background:#f2f2f2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .media .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(118,118,118,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .225s ease;color:rgba(255,255,255,.92);font-size:clamp(20px,2vw,28px);font-weight:500;letter-spacing:-.02em}
  .media .ov svg{width:1em;height:1em}
  .card[href]:hover .ov,.card[href]:focus-visible .ov{opacity:1}
  .meta{padding:14px 0 18px}
  .meta .t{font-size:14px;font-weight:500;color:var(--text)}
  .meta .d{font-size:14px;font-weight:500;color:var(--muted)}
  .end{padding:120px 0 160px;text-align:center}
  .end .btns{margin-top:24px}
  @media (max-width:767px){
    .wrap{padding-top:130px}
    .head h1{font-size:34px}
    .grid{grid-template-columns:1fr;margin-top:44px}
    .end{padding:80px 0 120px}
  }
</style>
</head>
<body>
<div class="frame-guide l" aria-hidden="true"></div>
<div class="frame-guide r" aria-hidden="true"></div>

<header class="top appear">
  <span class="mono">motion design</span>
  <a class="wordmark" href="index.html">HAZENE</a>
  <span class="mono" data-clock>--:--</span>
</header>
<a class="back appear" href="index.html" aria-label="Back home">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
</a>

<main class="wrap">
  <div class="head">
    <!-- Update this number by hand -->
    <h1 class="appear" style="animation-delay:.05s"><span class="accent">545K+</span> views generated<br>for AI &amp; SaaS launches</h1>
    <p class="sub appear" style="animation-delay:.15s"><b>Early-stage teams, including YC-backed startups,</b><br>get script, storyboard, motion and sound design in one place.</p>
  </div>

  <div class="grid" id="grid"></div>

  <section class="end">
    <h1 class="appear">Your product deserves<br>a launch that <span class="accent">lands</span></h1>
    <div class="btns">
      <a class="btn dark" href="call.html"><span class="roll"><span>Start the project</span><span aria-hidden="true">Start the project</span></span></a>
    </div>
  </section>
</main>

<footer class="foot">
  <a class="mono" href="https://www.linkedin.com/in/yoann-hazene-72b917331/" target="_blank" rel="noopener">LinkedIn</a>
  <a class="mono" href="https://x.com/Hazene_Edit" target="_blank" rel="noopener">@Hazene_Edit</a>
</footer>

<script src="clock.js"></script>
<script>
// One line per project: client name, views, X post link, clip in clips/
const PROJECTS = [
  {name:'RISE V2',                views:'56K views',  x:'https://x.com/risedotrich/status/2120155423135371444',   clip:'clips/rise-launch-2.mp4'},
  {name:'RunInfra',               views:'60K views',  x:'https://x.com/runinfrai/status/2112624102016249952',     clip:'clips/runinfra.mp4'},
  {name:'RightNow (System Zero)', views:'83K views',  x:'https://x.com/rightnowai_co/status/2116311411072835913', clip:'clips/rightnow.mp4'},
  {name:'Rise Launchpad',         views:'299K views', x:'https://x.com/risedotrich/status/2039704725059199251',   clip:'clips/rise-launch.mp4'},
  {name:'Rise Borrowing',         views:'47K views',  x:'https://x.com/risedotrich/status/2044795674642854060',   clip:'clips/rise-borrow.mp4'}
];

const grid = document.getElementById('grid');
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>';

PROJECTS.forEach((p, n) => {
  const a = document.createElement('a');
  a.className = 'card appear';
  a.style.animationDelay = (0.2 + n * 0.05) + 's';
  if (p.x) { a.href = p.x; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.setAttribute('aria-label', p.name + ' — view post on X'); }
  a.innerHTML =
    '<div class="media"><video src="' + p.clip + '" muted autoplay loop playsinline preload="metadata" aria-hidden="true"></video>'
    + '<div class="ov">View post ' + arrow + '</div></div>'
    + '<div class="meta"><div class="t">' + p.name + '</div><div class="d">' + p.views + '</div></div>';
  grid.appendChild(a);
});

// Only play clips that are on screen (saves battery and bandwidth)
const io = new IntersectionObserver(entries => entries.forEach(e => {
  const v = e.target;
  if (e.isIntersecting) { v.play().catch(() => {}); } else { v.pause(); }
}), { threshold: 0.15 });
document.querySelectorAll('.media video').forEach(v => io.observe(v));
</script>
</body>
</html>
